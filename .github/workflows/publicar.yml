name: Publicar APK y anuncio firmados
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la entrega verificada, por ejemplo v4.11
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publicar-prestamax
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar etiqueta solicitada
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]{1,3}(\.[0-9]{1,3}){1,2}", os.environ["RELEASE_TAG"])'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Comprobar firma, archivos y publicación
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/publicar.py
